[project]
name = "aftermath"
version = "0.1.0"
description = "An agent that manages the administrative aftermath of a death."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.optional-dependencies]
agents = [
    "strands-agents>=1.0",
    "strands-agents-tools",
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
aftermath = "aftermath.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
